<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="استعلم عن لجنتك ورقم الكشف في كشف الجمعية العمومية لنادي الطالبية الرياضي 2026 وتعرف على مرشحي قائمة الأمل برئاسة المستشار حسن مراد تاج الدين.">
<meta name="robots" content="index, follow">

<meta property="og:title" content="قائمة الأمل | انتخابات نادي الطالبية الرياضي 2026">
<meta property="og:description" content="اعرف لجنتك ورقم الكشف وتعرف على مرشحي قائمة الأمل.">
<title>قائمة الأمل | نادي الطالبية الرياضي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f2f9fd;--ink:#0b2a3d;--mute:#4a6a7e;--main:#0369a1;--gold:#38bdf8;--line:#c3e1f3;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header.top{padding:14px 0;border-bottom:1px solid var(--line);font-weight:700}
.hero{padding:34px 0 28px;text-align:center}
.hero small{color:var(--mute)}
.hero h1{font-size:clamp(2.2rem,9vw,3.6rem);margin:6px 0;font-weight:800;color:var(--main);line-height:1.2}
.hero p{margin:4px 0;color:var(--mute)}
.photo{width:min(260px,70%);aspect-ratio:1;border-radius:50%;margin:18px auto 0;border:5px solid var(--gold);object-fit:cover;display:grid;place-items:center;background:var(--main);color:var(--on);font-size:4rem;font-weight:800;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
section{padding:26px 0}
h2{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--main);color:var(--on);border-color:var(--main)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.go{padding:12px 18px;border:0;border-radius:10px;background:var(--main);color:var(--on);font:inherit;font-weight:800}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{font-size:.85rem;color:var(--mute);margin:10px 0 0}
#res{margin-top:14px}
.hit{border-top:1px solid var(--line);padding:10px 0}
.hit b{color:var(--main)}
.none{color:#b3261e;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.cand{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.cand .photo{width:96px;margin:0 auto 8px;border-width:3px;font-size:1.8rem}
.cand h3{margin:0;font-size:1.05rem}
.cand span{color:var(--mute);font-size:.9rem;display:block}.cand em{display:inline-block;margin-top:6px;padding:1px 10px;border-radius:99px;background:var(--main);color:var(--on);font-style:normal;font-size:.8rem;font-weight:700}
footer{padding:22px 0 30px;color:var(--mute);font-size:.82rem;border-top:1px solid var(--line)}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="brand"></div></header>
<main class="wrap">
  <div class="hero">
    <small id="kicker"></small>
    <h1 id="listName"></h1>
    <p id="headline"></p>
    <p id="date"></p>
    <div class="photo" id="headPhoto"></div>
  </div>

  <section>
    <h2>اعرف لجنتك</h2>
    <p class="sub">ابحث في كشف الجمعية العمومية بالاسم أو رقم العضوية.</p>
    <div class="box">
      <div class="tabs">
        <button type="button" id="tNum" aria-pressed="true">رقم العضوية</button>
        <button type="button" id="tName" aria-pressed="false">اسم العضو</button>
      </div>
      <div class="row">
        <input id="q" inputmode="numeric" placeholder="اكتب رقم العضوية" autocomplete="off">
        <button type="button" class="go" id="go">استعلام</button>
      </div>
      <p class="hint">لو رقم العضوية مشترك، هتظهر الأسماء التابعة له كلٌّ برقم الكشف الخاص به.</p>
      <div id="res" aria-live="polite"></div>
    </div>
  </section>

  <section>
    <h2 id="candTitle"></h2>
    <p class="sub">تعرف على أعضاء القائمة ومناصبهم</p>
    <div class="grid" id="cands"></div>
  </section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

let mode = "no";
function setMode(m) {
  mode = m;
  $("tNum").setAttribute("aria-pressed", m === "no");
  $("tName").setAttribute("aria-pressed", m === "name");
  $("q").placeholder = m === "no" ? "اكتب رقم العضوية" : "اكتب اسم العضو";
  $("q").inputMode = m === "no" ? "numeric" : "text";
  $("q").value = ""; $("res").innerHTML = "";
}
$("tNum").onclick = () => setMode("no");
$("tName").onclick = () => setMode("name");
const norm = s => String(s).replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
  .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\s+/g, " ").trim();
const IDX = MEMBERS.map(m => ({ m, d: String(m[0]).replace(/\D/g, ''), n: norm(m[1]) }));
function search() {
  const q = norm($("q").value);
  if (!q) { $("res").innerHTML = '<p class="none">اكتب بيانات البحث أولًا.</p>'; return; }
  let hits;
  if (mode === "no") { const d = q.replace(/\D/g, ''); hits = d ? IDX.filter(x => x.d === d) : []; }
  else { const t = q.split(" "); hits = IDX.filter(x => t.every(w => x.n.includes(w))); }
  const total = hits.length;
  hits = hits.slice(0, 40);
  $("res").innerHTML = total
    ? hits.map(x => '<div class="hit"><b>' + esc(x.m[1]) + '</b><br>رقم العضوية: ' + esc(x.m[0]) + ' · لجنة رقم ' + x.m[2] + ' · رقم الكشف: ' + x.m[3] + '</div>').join("") + (total > 40 ? '<p class="hint">ظهرت أول 40 نتيجة من ' + total + '، اكتب الاسم كاملًا لتضييق البحث.</p>' : '')
    : '<p class="none">غير موجود بالكشف. راجع إدارة النادي للتحقق.</p>';
}
$("go").onclick = search;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
